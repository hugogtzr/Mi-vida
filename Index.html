<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="apple-mobile-web-app-title" content="Mi Vida"/>
<meta name="theme-color" content="#f7f6f3"/>
<title>Mi Vida</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:wght@400;600&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap"/>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0;}
body{background:#f7f6f3;font-family:'DM Sans',system-ui,sans-serif;padding-bottom:env(safe-area-inset-bottom);}
input,select,textarea,button{font-family:inherit;}
::-webkit-scrollbar{display:none;}
.serif{font-family:'Lora',Georgia,serif;}
.card{background:#fff;border:1px solid #e6e2da;border-radius:10px;padding:15px 17px;}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e6e2da;display:flex;z-index:100;padding-bottom:env(safe-area-inset-bottom);}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:9px 2px 11px;border:none;background:none;color:#a09890;font-size:9px;font-weight:400;gap:3px;font-family:inherit;cursor:pointer;-webkit-appearance:none;}
.nav-btn.active{color:#1a3d16;font-weight:600;}
.bar-bg{background:#eeebe4;border-radius:99px;overflow:hidden;}
.bar-fill{height:100%;border-radius:99px;transition:width .4s ease;}
.pill{font-size:12px;font-weight:500;padding:5px 13px;border-radius:99px;white-space:nowrap;border:1px solid #e6e2da;background:transparent;color:#6a6057;font-family:inherit;cursor:pointer;-webkit-appearance:none;}
.pill.active{background:#1a3d16;color:#fff;border-color:#1a3d16;}
.inp{font-size:13px;padding:8px 11px;border-radius:6px;border:1px solid #e6e2da;background:#f7f6f3;color:#18150f;outline:none;width:100%;font-family:inherit;}
.btn{font-size:13px;font-weight:500;padding:8px 15px;border-radius:6px;display:inline-flex;align-items:center;gap:5px;border:none;font-family:inherit;cursor:pointer;-webkit-appearance:none;}
.btn-p{background:#1a3d16;color:#fff;}
.btn-g{background:none;color:#6a6057;border:1px solid #e6e2da;}
.btn-gr{background:#dcfce7;color:#16a34a;border:1px solid #86efac;}
.lbl{font-size:11px;color:#6a6057;font-weight:600;text-transform:uppercase;letter-spacing:.6px;margin-bottom:7px;}
.empty{color:#a09890;font-size:13px;text-align:center;padding:24px 0;}
.hidden{display:none!important;}
.tabs-row{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;-webkit-overflow-scrolling:touch;margin-bottom:14px;}
.mood-btn{font-size:22px;background:none;border:1px solid transparent;border-radius:8px;padding:5px 8px;cursor:pointer;-webkit-appearance:none;}
.mood-btn.active{background:#edf5eb;border-color:#1a3d16;}
.hcircle{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;border:2px solid #ccc;cursor:pointer;-webkit-appearance:none;background:transparent;}
.dcell{width:21px;height:21px;border-radius:4px;border:none;font-size:8px;font-family:inherit;cursor:pointer;-webkit-appearance:none;}
.streak-card{background:linear-gradient(135deg,#fef3c7,#fde68a);border:1px solid #fbbf24;border-radius:10px;padding:12px 16px;display:flex;align-items:center;gap:12px;margin-bottom:12px;}
.divider{height:1px;background:#eeebe4;margin:12px 0;}
textarea{resize:vertical;border:none;outline:none;background:transparent;width:100%;font-family:'Lora',Georgia,serif;}
/* iOS fix: make all clickable elements have cursor:pointer */
[data-action]{cursor:pointer;}
</style>
</head>
<body>
<div id="app" style="max-width:540px;margin:0 auto;min-height:100vh;background:#f7f6f3;padding-bottom:82px;">
  <div id="header" style="padding:24px 22px 0;margin-bottom:20px;">
    <div class="serif" style="font-size:24px;color:#18150f;font-weight:600;letter-spacing:-.3px;">Mi Vida</div>
    <div id="hdate" style="font-size:12px;color:#a09890;margin-top:2px;"></div>
    <div style="height:1px;background:#e6e2da;margin-top:16px;"></div>
    <div id="ptitle" class="serif" style="font-size:20px;color:#18150f;margin-top:14px;font-weight:600;display:none;"></div>
  </div>
  <div style="padding:0 22px;">
    <div id="page-home"></div>
    <div id="page-finance" class="hidden"></div>
    <div id="page-goals" class="hidden"></div>
    <div id="page-habits" class="hidden"></div>
    <div id="page-nutrition" class="hidden"></div>
    <div id="page-journal" class="hidden"></div>
  </div>
</div>
<nav class="bottom-nav">
  <button class="nav-btn active" data-action="nav" data-tab="home">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    Inicio
  </button>
  <button class="nav-btn" data-action="nav" data-tab="finance">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12V7a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-5"/><path d="M16 12a2 2 0 0 0 0 4h5v-4Z"/></svg>
    Finanzas
  </button>
  <button class="nav-btn" data-action="nav" data-tab="goals">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>
    Metas
  </button>
  <button class="nav-btn" data-action="nav" data-tab="habits">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
    Hábitos
  </button>
  <button class="nav-btn" data-action="nav" data-tab="nutrition">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8h1a4 4 0 0 1 0 8h-1"/><path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8Z"/><line x1="6" y1="1" x2="6" y2="4"/><line x1="10" y1="1" x2="10" y2="4"/><line x1="14" y1="1" x2="14" y2="4"/></svg>
    Comida
  </button>
  <button class="nav-btn" data-action="nav" data-tab="journal">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
    Diario
  </button>
</nav>
<script>
'use strict';
// ── Constants ────────────────────────────────────────────────────────────────
const MONTHS=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const MEAL_TYPES=['Desayuno','Almuerzo','Cena','Snack'];
const HCOLORS=['#6366f1','#f59e0b','#10b981','#ef4444','#8b5cf6','#ec4899','#14b8a6','#f97316'];
const MOODS=[{e:'😔',l:'Difícil'},{e:'😐',l:'Regular'},{e:'🙂',l:'Bien'},{e:'😄',l:'Genial'},{e:'🤩',l:'Increíble'}];
const DTYPES=['TDC','Préstamo personal','Préstamo familiar/amigo','Crédito automotriz','Hipoteca','Otro'];
const ECATS=['Comida','Transporte','Entretenimiento','Salud','Ropa','Servicios','Educación','Otro'];
const ICATS=['Sueldo','Freelance','Negocio','Inversión','Regalo','Otro'];
const GCATS=['Ahorro','Deuda','Inversión','Personal','Otro'];
const GICONS=['🎯','💰','📈','🏋️','📚','✈️','🏠','💳','🌱','⭐'];
const TCOLOR={'TDC':'#6366f1','Préstamo personal':'#f59e0b','Préstamo familiar/amigo':'#ec4899','Crédito automotriz':'#14b8a6','Hipoteca':'#3b82f6','Otro':'#9d9790'};
const CCOLOR={Ahorro:'#16a34a',Deuda:'#dc2626','Inversión':'#1d4ed8',Personal:'#7c3aed',Otro:'#d97706'};
const MCOLOR={Desayuno:'#f59e0b',Almuerzo:'#10b981',Cena:'#6366f1',Snack:'#ec4899'};
const TITLES={home:'',finance:'Finanzas',goals:'Metas',habits:'Hábitos',nutrition:'Alimentación',journal:'Diario'};

// ── Storage ──────────────────────────────────────────────────────────────────
const gk=(p,...a)=>`mv_${p}_${a.join('_')}`;
const ld=(k,fb)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):fb;}catch{return fb;}};
const sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));}catch{}};
const uid=()=>Math.random().toString(36).slice(2,9);
const DIM=(y,m)=>new Date(y,m+1,0).getDate();
const NOW=()=>{const d=new Date();return{y:d.getFullYear(),m:d.getMonth(),d:d.getDate()};};
const F$=n=>(n||0).toLocaleString('es-MX',{style:'currency',currency:'MXN',minimumFractionDigits:0,maximumFractionDigits:0});
const FD=(y,m,d)=>`${String(d).padStart(2,'0')} ${MONTHS[m].slice(0,3)} ${y}`;
const G=id=>document.getElementById(id);

// ── SVG ──────────────────────────────────────────────────────────────────────
const IC={
  plus:(s=16)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>`,
  check:(s=13,c='#fff')=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="3" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg>`,
  trash:(s=15)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>`,
  save:(s=14)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>`,
  edit:(s=15)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4z"/></svg>`,
  left:`<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="15 18 9 12 15 6"/></svg>`,
  right:`<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="9 18 15 12 9 6"/></svg>`,
  search:`<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>`
};

// ── UI helpers ───────────────────────────────────────────────────────────────
const bar=(v,c='#1a3d16',h=6)=>`<div class="bar-bg" style="height:${h}px"><div class="bar-fill" style="width:${Math.min(100,Math.max(0,v))}%;height:100%;background:${c}"></div></div>`;
const navRow=(prev,next,label)=>`<div style="display:flex;align-items:center;gap:10px;margin-bottom:18px"><button class="btn btn-g" style="padding:5px 8px" data-action="${prev}">${IC.left}</button><span class="serif" style="flex:1;text-align:center;font-size:15px;font-weight:600;color:#18150f">${label}</span><button class="btn btn-g" style="padding:5px 8px" data-action="${next}">${IC.right}</button></div>`;
const iBtn=(action,ico,id='')=>`<button class="btn btn-g" style="padding:4px 6px;min-width:0;border:none;background:none;color:#a09890" data-action="${action}"${id?` data-id="${id}"`:''} >${ico}</button>`;

// ── App state ────────────────────────────────────────────────────────────────
let CUR='home';
let finTab='overview',finY,finM;
let habView='today';
let nutSel=null;
let jSel=null,jView='write',jSearch='';
let txKind='income';
let editDebtId=null;

// ── Navigation ───────────────────────────────────────────────────────────────
function goTo(tab){
  CUR=tab;
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));
  ['home','finance','goals','habits','nutrition','journal'].forEach(p=>G(`page-${p}`).classList.toggle('hidden',p!==tab));
  const pt=G('ptitle');
  if(tab==='home'){pt.style.display='none';}else{pt.style.display='block';pt.textContent=TITLES[tab];}
  render(tab);
}
function render(t){
  if(t==='home')renderHome();
  else if(t==='finance')renderFinance();
  else if(t==='goals')renderGoals();
  else if(t==='habits')renderHabits();
  else if(t==='nutrition')renderNutrition();
  else if(t==='journal')renderJournal();
}

// ── Event delegation (iOS Safari fix) ───────────────────────────────────────
document.addEventListener('click',function(e){
  const el=e.target.closest('[data-action]');
  if(!el)return;
  e.preventDefault();
  const a=el.dataset.action;
  const id=el.dataset.id||'';
  // Navigation
  if(a==='nav'){goTo(el.dataset.tab);return;}
  // Finance
  if(a==='fin-tab'){finTab=el.dataset.tab;renderFinance();return;}
  if(a==='fin-prev'){finM===0?(finY--,finM=11):finM--;renderFinance();return;}
  if(a==='fin-next'){finM===11?(finY++,finM=0):finM++;renderFinance();return;}
  if(a==='wallet-edit'){editWallet();return;}
  if(a==='show-tx-form'){showTxForm();return;}
  if(a==='tx-kind'){setTxKind(el.dataset.kind);return;}
  if(a==='add-tx'){addTx();return;}
  if(a==='cancel-tx'){renderFinance();return;}
  if(a==='del-tx'){delTx(id);return;}
  if(a==='show-debt-form'){showDebtForm();return;}
  if(a==='edit-debt'){editDebtForm(id);return;}
  if(a==='save-debt'){saveDebt();return;}
  if(a==='cancel-debt'){renderFinance();return;}
  if(a==='del-debt'){delDebt(id);return;}
  if(a==='pay-debt'){payDebt(id);return;}
  // Goals
  if(a==='show-goal-form'){showGoalForm();return;}
  if(a==='sel-icon'){selGoalIcon(el,el.dataset.icon);return;}
  if(a==='save-goal'){saveGoal(el.dataset.id||null);return;}
  if(a==='cancel-goal'){renderGoals();return;}
  if(a==='edit-goal'){editGoalForm(id);return;}
  if(a==='del-goal'){delGoal(id);return;}
  if(a==='contribute-goal'){contributeGoal(id);return;}
  // Habits
  if(a==='hab-view'){habView=el.dataset.view;renderHabits();return;}
  if(a==='toggle-habit'){toggleHabit(el.dataset.hid,parseInt(el.dataset.day));return;}
  if(a==='show-hab-form'){showHabitForm();return;}
  if(a==='add-hab'){addHabit();return;}
  if(a==='cancel-hab'){renderHabits();return;}
  if(a==='del-hab'){delHabit(id);return;}
  // Nutrition
  if(a==='nut-prev'){nutShift(-1);return;}
  if(a==='nut-next'){nutShift(1);return;}
  if(a==='show-meal-form'){showMealForm();return;}
  if(a==='meal-type'){setMealType(el.dataset.type,el);return;}
  if(a==='add-meal'){addMeal();return;}
  if(a==='cancel-meal'){renderNutrition();return;}
  if(a==='del-meal'){delMeal(id);return;}
  // Journal
  if(a==='j-view'){jView=el.dataset.view;renderJournal();return;}
  if(a==='j-prev'){jShift(-1);return;}
  if(a==='j-next'){jShift(1);return;}
  if(a==='j-mood'){setMood(parseInt(el.dataset.mood));return;}
  if(a==='j-save'){saveJournal();return;}
  if(a==='j-prompt'){insertPrompt(el.dataset.p);return;}
  if(a==='j-open'){jSel={y:parseInt(el.dataset.y),m:parseInt(el.dataset.m),d:parseInt(el.dataset.d)};jView='write';renderJournal();return;}
  // Home shortcuts
  if(a==='go-finance'){goTo('finance');return;}
  if(a==='go-habits'){goTo('habits');return;}
  if(a==='go-goals'){goTo('goals');return;}
  if(a==='go-journal'){goTo('journal');return;}
});

// Input events
document.addEventListener('input',function(e){
  if(e.target.id==='j-textarea'){autoSaveJ(e.target);}
  if(e.target.id==='j-search'){jSearch=e.target.value;renderJournal();}
});

// ── HOME ────────────────────────────────────────────────────────────────────
function renderHome(){
  const{y,m,d}=NOW();
  const habits=ld(gk('habits'),[]);
  const checks=ld(gk('checks',y,m),{});
  const done=habits.filter(h=>!!checks[`${h.id}_${d}`]).length;
  const txns=ld(gk('txns',y,m),[]);
  const wallet=ld(gk('wallet'),0);
  const inc=txns.filter(t=>t.kind==='income').reduce((s,t)=>s+t.amount,0);
  const exp=txns.filter(t=>t.kind==='expense').reduce((s,t)=>s+t.amount,0);
  const debts=ld(gk('debts'),[]);
  const totalD=debts.reduce((s,d)=>s+d.balance,0);
  const bal=wallet+inc-exp;
  const goals=ld(gk('goals'),[]);
  const active=goals.filter(g=>g.current<g.target);
  const entry=ld(gk('journal',y,m,d),{text:'',mood:null});
  let streak=0;
  if(habits.length){for(let i=0;i<365;i++){const dt=new Date(y,m,d-i);const sy=dt.getFullYear(),sm=dt.getMonth(),sd=dt.getDate();const ch=ld(gk('checks',sy,sm),{});if(habits.every(h=>!!ch[`${h.id}_${sd}`]))streak++;else if(i>0)break;}}
  const hr=new Date().getHours();
  const greet=hr<12?'Buenos días ☀️':hr<19?'Buenas tardes 🌤️':'Buenas noches 🌙';
  let h=`<div style="margin-bottom:20px"><div class="serif" style="font-size:22px;color:#18150f;font-weight:600">${greet}</div><div style="font-size:13px;color:#6a6057">${new Date().toLocaleDateString('es-MX',{weekday:'long',day:'numeric',month:'long'})}</div></div>`;
  if(streak>0)h+=`<div class="streak-card"><span style="font-size:28px">🔥</span><div><div class="serif" style="font-size:18px;font-weight:600;color:#92400e">${streak} ${streak===1?'día':'días'} de racha</div><div style="font-size:12px;color:#b45309">¡Todos tus hábitos completados!</div></div></div>`;
  h+=`<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px">
    <button class="card" data-action="go-finance" style="border-top:3px solid #16a34a;text-align:left;cursor:pointer;width:100%;background:#fff"><div style="font-size:10px;color:#6a6057;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px">Balance del mes</div><div class="serif" style="font-size:17px;font-weight:600;color:#16a34a">${F$(bal)}</div></button>
    <button class="card" data-action="go-finance" style="border-top:3px solid #dc2626;text-align:left;cursor:pointer;width:100%;background:#fff"><div style="font-size:10px;color:#6a6057;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px">Total deudas</div><div class="serif" style="font-size:17px;font-weight:600;color:#dc2626">${F$(totalD)}</div><div style="font-size:11px;color:#a09890;margin-top:2px">${debts.length} ${debts.length===1?'deuda':'deudas'}</div></button>
  </div>
  <button class="card" data-action="go-habits" style="width:100%;text-align:left;cursor:pointer;margin-bottom:12px;background:#fff">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><span style="font-size:13px;font-weight:600;color:#18150f">Hábitos de hoy</span><span style="font-size:12px;font-weight:600;color:${done===habits.length&&habits.length>0?'#16a34a':'#6a6057'}">${done}/${habits.length}</span></div>
    ${habits.length===0?'<div style="font-size:12px;color:#a09890">Sin hábitos aún.</div>':habits.slice(0,4).map(h=>`<div style="display:flex;align-items:center;gap:8px;margin-bottom:5px"><div style="width:14px;height:14px;border-radius:50%;background:${checks[`${h.id}_${d}`]?h.color:'#eeebe4'};border:2px solid ${h.color};flex-shrink:0;display:flex;align-items:center;justify-content:center">${checks[`${h.id}_${d}`]?IC.check(8):''}</div><span style="font-size:13px;color:${checks[`${h.id}_${d}`]?'#a09890':'#18150f'};text-decoration:${checks[`${h.id}_${d}`]?'line-through':'none'}">${h.name}</span></div>`).join('')+(habits.length>4?`<div style="font-size:11px;color:#a09890">+${habits.length-4} más</div>`:'')}
  </button>`;

  G('page-home').innerHTML=h;

// ── FINANCE ─────────────────────────────────────────────────────────────────
function renderFinance(){
  if(!finY){const{y,m}=NOW();finY=y;finM=m;}

  const wallet=ld(gk('wallet'),0);
  const debts=ld(gk('debts'),[]);
  const inc=txns.filter(t=>t.kind==='income').reduce((s,t)=>s+t.amount,0);
  const exp=txns.filter(t=>t.kind==='expense').reduce((s,t)=>s+t.amount,0);
  const mbal=inc-exp;
  const td=debts.reduce((s,d)=>s+d.balance,0);
  const nw=wallet+mbal-td;
  let h=`<div class="tabs-row"><button class="pill${finTab==='overview'?' active':''}" data-action="fin-tab" data-tab="overview">Resumen</button><button class="pill${finTab==='txns'?' active':''}" data-action="fin-tab" data-tab="txns">Movimientos</button><button class="pill${finTab==='debts'?' active':''}" data-action="fin-tab" data-tab="debts">Deudas</button></div>`;
  if(finTab==='overview'){

    h+=`<div class="card" style="margin-bottom:12px;border-top:3px solid ${nw>=0?'#16a34a':'#dc2626'}"><div style="font-size:11px;color:#6a6057;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px">Patrimonio neto</div><div class="serif" style="font-size:28px;font-weight:600;color:${nw>=0?'#16a34a':'#dc2626'};margin-bottom:8px">${F$(nw)}</div><div style="display:flex;gap:6px;flex-wrap:wrap"><span style="font-size:11px;background:#dcfce7;color:#16a34a;padding:2px 8px;border-radius:99px">Dinero: ${F$(wallet)}</span><span style="font-size:11px;background:${mbal>=0?'#dcfce7':'#fee2e2'};color:${mbal>=0?'#16a34a':'#dc2626'};padding:2px 8px;border-radius:99px">Mes: ${mbal>=0?'+':''}${F$(mbal)}</span><span style="font-size:11px;background:#fee2e2;color:#dc2626;padding:2px 8px;border-radius:99px">Deudas: -${F$(td)}</span></div></div>
    <div class="card" style="margin-bottom:12px"><div style="display:flex;justify-content:space-between;align-items:center"><div><div style="font-size:11px;color:#6a6057;text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px">Mi dinero base</div><div class="serif" style="font-size:22px;font-weight:600;color:#18150f">${F$(wallet)}</div></div><button class="btn btn-g" data-action="wallet-edit">${IC.edit()}</button></div></div>
    ${navRow('fin-prev','fin-next',MONTHS[finM]+' '+finY)}
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px"><div class="card" style="border-top:3px solid #16a34a;padding:12px 14px"><div style="font-size:10px;color:#6a6057;text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px">Ingresos</div><div class="serif" style="font-size:17px;font-weight:600;color:#16a34a">${F$(inc)}</div></div><div class="card" style="border-top:3px solid #dc2626;padding:12px 14px"><div style="font-size:10px;color:#6a6057;text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px">Gastos</div><div class="serif" style="font-size:17px;font-weight:600;color:#dc2626">${F$(exp)}</div></div></div>
    ${top.length?`<div class="card" style="margin-bottom:12px"><div class="lbl">Gastos por categoría</div>${top.map(([c,v])=>`<div style="margin-bottom:8px"><div style="display:flex;justify-content:space-between;margin-bottom:3px"><span style="font-size:13px;color:#18150f">${c}</span><span style="font-size:13px;color:#dc2626">${F$(v)}</span></div>${bar(exp>0?v/exp*100:0,'#dc2626',5)}</div>`).join('')}</div>`:''}
    ${debts.length?`<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><div class="lbl" style="margin:0">Deudas</div><span style="font-size:13px;font-weight:600;color:#dc2626">${F$(td)}</span></div>${debts.map(d=>{const p=d.total>0?Math.round((1-d.balance/d.total)*100):100;const tc=TCOLOR[d.type]||'#9d9790';return`<div style="margin-bottom:10px"><div style="display:flex;justify-content:space-between;margin-bottom:3px"><span style="font-size:13px;color:#18150f">${d.name} <span style="font-size:11px;color:${tc}">(${d.type})</span></span><span style="font-size:13px;color:#dc2626">${F$(d.balance)}</span></div>${bar(p,tc,5)}</div>`;}).join('')}</div>`:''}`;
  }
  if(finTab==='txns'){
    h+=`${navRow('fin-prev','fin-next',MONTHS[finM]+' '+finY)}${txns.length===0?'<div class="empty">Sin movimientos este mes.</div>':''}<div style="display:flex;flex-direction:column;gap:8px;margin-bottom:14px">${[...txns].reverse().map(t=>`<div class="card" style="display:flex;align-items:center;gap:12px;padding:11px 14px"><div style="width:8px;height:8px;border-radius:50%;background:${t.kind==='income'?'#16a34a':'#dc2626'};flex-shrink:0"></div><div style="flex:1;min-width:0"><div style="font-size:13px;color:#18150f;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${t.label}</div><div style="font-size:11px;color:#a09890">${t.cat}</div></div><span style="font-size:14px;font-weight:600;color:${t.kind==='income'?'#16a34a':'#dc2626'};white-space:nowrap">${t.kind==='income'?'+':'-'}${F$(t.amount)}</span>${iBtn('del-tx',IC.trash(),t.id)}</div>`).join('')}</div><div id="tx-wrap"><button class="btn btn-p" style="width:100%;justify-content:center" data-action="show-tx-form">${IC.plus()} Agregar movimiento</button></div>`;
  }
  if(finTab==='debts'){
    h+=`<div class="card" style="margin-bottom:14px;border-top:3px solid #dc2626;padding:12px 16px"><div style="font-size:11px;color:#6a6057;text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px">Total adeudado</div><div class="serif" style="font-size:24px;font-weight:600;color:#dc2626">${F$(td)}</div><div style="font-size:12px;color:#a09890;margin-top:2px">${debts.length} ${debts.length===1?'deuda activa':'deudas activas'}</div></div>${debts.length===0?'<div class="empty">Sin deudas. ¡Excelente!</div>':''}<div style="display:flex;flex-direction:column;gap:10px;margin-bottom:14px">${debts.map(d=>{const p=d.total>0?Math.round((1-d.balance/d.total)*100):100;const tc=TCOLOR[d.type]||'#9d9790';return`<div class="card"><div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px"><div><div style="font-size:14px;font-weight:600;color:#18150f">${d.name}</div><span style="font-size:11px;background:${tc}22;color:${tc};padding:2px 8px;border-radius:99px">${d.type}</span></div><div style="text-align:right"><div class="serif" style="font-size:16px;font-weight:600;color:#dc2626">${F$(d.balance)}</div><div style="font-size:11px;color:#a09890">de ${F$(d.total)}</div></div></div><div style="margin-bottom:8px"><div style="display:flex;justify-content:space-between;margin-bottom:3px"><span style="font-size:11px;color:#6a6057">Progreso de pago</span><span style="font-size:11px;color:${tc};font-weight:600">${p}%</span></div>${bar(p,tc,7)}</div>${d.minPay>0?`<div style="font-size:11px;color:#6a6057;margin-bottom:10px">Pago mínimo: ${F$(d.minPay)}</div>`:''}<div style="display:flex;gap:8px"><button class="btn btn-g" style="flex:1;justify-content:center" data-action="edit-debt" data-id="${d.id}">${IC.edit()} Editar</button><button class="btn btn-gr" style="flex:1;justify-content:center" data-action="pay-debt" data-id="${d.id}">Abonar</button>${iBtn('del-debt',IC.trash(),d.id)}</div></div>`;}).join('')}</div><div id="debt-wrap"><button class="btn btn-p" style="width:100%;justify-content:center" data-action="show-debt-form">${IC.plus()} Registrar deuda</button></div>`;
  }
  G('page-finance').innerHTML=h;
}
function editWallet(){const c=ld(gk('wallet'),0);const v=prompt('¿Cuánto dinero tienes actualmente?',c);if(v!==null&&!isNaN(parseFloat(v))){sv(gk('wallet'),parseFloat(v));renderFinance();}}
function showTxForm(){
  const wrap=G('tx-wrap');if(!wrap)return;
  wrap.innerHTML=`<div class="card"><div class="lbl">Nuevo movimiento</div><div class="tabs-row"><button class="pill active" data-action="tx-kind" data-kind="income" id="pk-inc">Ingreso</button><button class="pill" data-action="tx-kind" data-kind="expense" id="pk-exp">Gasto</button></div><div style="display:flex;flex-direction:column;gap:8px"><select class="inp" id="tx-cat">${ICATS.map(c=>`<option>${c}</option>`).join('')}</select><input class="inp" id="tx-label" placeholder="Descripción"/><input class="inp" type="number" id="tx-amount" placeholder="Monto" inputmode="decimal"/><div style="display:flex;gap:8px"><button class="btn btn-p" data-action="add-tx">${IC.save()} Guardar</button><button class="btn btn-g" data-action="cancel-tx">Cancelar</button></div></div></div>`;
  txKind='income';
  setTimeout(()=>{const i=G('tx-label');if(i)i.focus();},100);

function setTxKind(k){
  txKind=k;
  const pi=G('pk-inc'),pe=G('pk-exp');
  if(pi)pi.classList.toggle('active',k==='income');
  if(pe)pe.classList.toggle('active',k==='expense');
  const cat=G('tx-cat');if(cat)cat.innerHTML=(k==='income'?ICATS:ECATS).map(c=>`<option>${c}</option>`).join('');

function addTx(){
  const label=(G('tx-label')||{}).value?.trim();
  const amount=parseFloat((G('tx-amount')||{}).value||'0');
  const cat=(G('tx-cat')||{}).value;
  if(!label||!amount)return;
  const txns=ld(gk('txns',finY,finM),[]);
  txns.push({id:uid(),kind:txKind,cat,label,amount,date:new Date().toISOString()});
  sv(gk('txns',finY,finM),txns);renderFinance();
}
function delTx(id){if(!confirm('¿Eliminar?'))return;sv(gk('txns',finY,finM),ld(gk('txns',finY,finM),[]).filter(t=>t.id!==id));renderFinance();}
function showDebtForm(d){
  const wrap=G('debt-wrap');if(!wrap)return;
  editDebtId=d?d.id:null;
  wrap.innerHTML=`<div class="card"><div class="lbl">${d?'Editar':'Nueva'} deuda</div><div style="display:flex;flex-direction:column;gap:8px"><input class="inp" id="dn" placeholder="Nombre (ej. TDC Banamex)" value="${d?d.name:''}"/><select class="inp" id="dt">${DTYPES.map(t=>`<option${d&&d.type===t?' selected':''}>${t}</option>`).join('')}</select><input class="inp" type="number" id="dto" placeholder="Monto original" value="${d?d.total:''}" inputmode="decimal"/><input class="inp" type="number" id="db" placeholder="Saldo pendiente" value="${d?d.balance:''}" inputmode="decimal"/><input class="inp" type="number" id="dmp" placeholder="Pago mínimo (opcional)" value="${d&&d.minPay?d.minPay:''}" inputmode="decimal"/><div style="display:flex;gap:8px"><button class="btn btn-p" data-action="save-debt">${IC.save()} Guardar</button><button class="btn btn-g" data-action="cancel-debt">Cancelar</button></div></div></div>`;
}
function editDebtForm(id){showDebtForm(ld(gk('debts'),[]).find(x=>x.id===id));}
function saveDebt(){
  const name=(G('dn')||{}).value?.trim();
  const balance=parseFloat((G('db')||{}).value||'0');
  if(!name||!balance)return;
  const obj={name,type:(G('dt')||{}).value,total:parseFloat((G('dto')||{}).value||balance),balance,minPay:parseFloat((G('dmp')||{}).value||0)};
  let debts=ld(gk('debts'),[]);
  if(editDebtId)debts=debts.map(d=>d.id===editDebtId?{...d,...obj}:d);

}
function delDebt(id){if(!confirm('¿Eliminar?'))return;sv(gk('debts'),ld(gk('debts'),[]).filter(d=>d.id!==id));renderFinance();}
function payDebt(id){const a=parseFloat(prompt('¿Cuánto abonás?')||'0');if(!a||a<=0)return;sv(gk('debts'),ld(gk('debts'),[]).map(d=>d.id===id?{...d,balance:Math.max(0,d.balance-a)}:d));renderFinance();}

// ── GOALS ───────────────────────────────────────────────────────────────────
function renderGoals(){
  const goals=ld(gk('goals'),[]);
  const active=goals.filter(g=>g.current<g.target);
  const done=goals.filter(g=>g.current>=g.target);
  let h='';
  if(!goals.length)h='<div class="empty">Agrega tu primera meta.</div>';
  if(active.length)h+=`<div class="lbl">En progreso</div><div style="display:flex;flex-direction:column;gap:10px;margin-bottom:16px">${active.map(g=>{const p=Math.round(g.current/g.target*100);const cc=CCOLOR[g.cat]||'#1a3d16';const im=g.target>100;return`<div class="card"><div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px"><div style="display:flex;align-items:center;gap:8px"><span style="font-size:22px">${g.icon}</span><div><div style="font-size:14px;font-weight:600;color:#18150f">${g.name}</div><span style="font-size:11px;background:${cc}22;color:${cc};padding:2px 7px;border-radius:99px">${g.cat}</span></div></div><div style="text-align:right"><div class="serif" style="font-size:15px;font-weight:600;color:${cc}">${im?F$(g.current):g.current}</div><div style="font-size:11px;color:#a09890">de ${im?F$(g.target):g.target}</div></div></div><div style="margin-bottom:10px"><div style="display:flex;justify-content:space-between;margin-bottom:3px"><span style="font-size:11px;color:#6a6057">Progreso</span><span style="font-size:11px;font-weight:600;color:${cc}">${p}%</span></div>${bar(p,cc,8)}</div>${g.notes?`<div style="font-size:12px;color:#6a6057;margin-bottom:10px;font-style:italic">${g.notes}</div>`:''}<div style="display:flex;gap:8px"><button class="btn btn-p" style="flex:1;justify-content:center" data-action="contribute-goal" data-id="${g.id}">${IC.plus(14)} Abonar</button><button class="btn btn-g" data-action="edit-goal" data-id="${g.id}">${IC.edit()}</button>${iBtn('del-goal',IC.trash(),g.id)}</div></div>`;}).join('')}</div>`;
  if(done.length)h+=`<div class="lbl">✅ Completadas</div><div style="display:flex;flex-direction:column;gap:8px;margin-bottom:16px">${done.map(g=>`<div class="card" style="background:#edf5eb"><div style="display:flex;justify-content:space-between;align-items:center"><span style="font-size:13px;color:#1a3d16;font-weight:500">${g.icon} ${g.name}</span><div style="display:flex;align-items:center;gap:8px"><span style="font-size:12px;color:#16a34a;font-weight:600">¡Logrado! 🎉</span>${iBtn('del-goal',IC.trash(),g.id)}</div></div></div>`).join('')}</div>`;
  h+=`<div id="goal-wrap"><button class="btn btn-p" style="width:100%;justify-content:center" data-action="show-goal-form">${IC.plus()} Nueva meta</button></div>`;
  G('page-goals').innerHTML=h;
}
function showGoalForm(g){
  const wrap=G('goal-wrap');if(!wrap)return;
  wrap.innerHTML=`<div class="card"><div class="lbl">${g?'Editar':'Nueva'} meta</div><div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px" id="ipick">${GICONS.map(ic=>`<button style="font-size:20px;background:${g&&g.icon===ic?'#edf5eb':'none'};border:1px solid ${g&&g.icon===ic?'#1a3d16':'#e6e2da'};border-radius:6px;padding:4px 8px" data-action="sel-icon" data-icon="${ic}">${ic}</button>`).join('')}</div><input type="hidden" id="gicon" value="${g?g.icon:'🎯'}"/><div style="display:flex;flex-direction:column;gap:8px"><input class="inp" id="gname" placeholder="Nombre de la meta" value="${g?g.name:''}"/><select class="inp" id="gcat">${GCATS.map(c=>`<option${g&&g.cat===c?' selected':''}>${c}</option>`).join('')}</select><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><input class="inp" type="number" id="gtarget" placeholder="Meta total" value="${g?g.target:''}" inputmode="decimal"/><input class="inp" type="number" id="gcurrent" placeholder="Avance actual" value="${g?g.current:0}" inputmode="decimal"/></div><input class="inp" id="gnotes" placeholder="Notas (opcional)" value="${g?g.notes||'':''}"/><div style="display:flex;gap:8px"><button class="btn btn-p" data-action="save-goal" data-id="${g?g.id:''}">${IC.save()} Guardar</button><button class="btn btn-g" data-action="cancel-goal">Cancelar</button></div></div></div>`;

function selGoalIcon(btn,ic){document.querySelectorAll('#ipick button').forEach(b=>{b.style.background='none';b.style.borderColor='#e6e2da';});btn.style.background='#edf5eb';btn.style.borderColor='#1a3d16';const gi=G('gicon');if(gi)gi.value=ic;}
function editGoalForm(id){showGoalForm(ld(gk('goals'),[]).find(g=>g.id===id));}

function delGoal(id){if(!confirm('¿Eliminar?'))return;sv(gk('goals'),ld(gk('goals'),[]).filter(g=>g.id!==id));renderGoals();}
function contributeGoal(id){const a=parseFloat(prompt('¿Cuánto abonás?')||'0');if(!a||a<=0)return;sv(gk('goals'),ld(gk('goals'),[]).map(g=>g.id===id?{...g,current:Math.min(g.target,g.current+a)}:g));renderGoals();}

// ── HABITS ──────────────────────────────────────────────────────────────────
function renderHabits(){
  const{y,m,d:td}=NOW();const dim_=DIM(y,m);
  const habits=ld(gk('habits'),[]);const checks=ld(gk('checks',y,m),{});
  const ckd=(hid,day)=>!!checks[`${hid}_${day}`];
  const pct=hid=>{const dn=Array.from({length:td},(_,i)=>ckd(hid,i+1)).filter(Boolean).length;return td>0?Math.round(dn/td*100):0;};
  let h=`<div class="tabs-row"><button class="pill${habView==='today'?' active':''}" data-action="hab-view" data-view="today">Hoy</button><button class="pill${habView==='grid'?' active':''}" data-action="hab-view" data-view="grid">Progreso</button></div>`;
  if(!habits.length)h+=`<div class="empty">Agrega tu primer hábito.</div>`;
  if(habView==='today')h+=`<div style="display:flex;flex-direction:column;gap:10px">${habits.map(hb=>`<div class="card" style="display:flex;align-items:center;gap:12px"><button class="hcircle" data-action="toggle-habit" data-hid="${hb.id}" data-day="${td}" style="border-color:${hb.color};background:${ckd(hb.id,td)?hb.color:'transparent'}">${ckd(hb.id,td)?IC.check(12):''}</button><div style="flex:1"><div style="font-size:14px;color:#18150f;margin-bottom:4px">${hb.name}</div>${bar(pct(hb.id),hb.color)}<div style="font-size:11px;color:#a09890;margin-top:2px">${pct(hb.id)}% este mes</div></div>${iBtn('del-hab',IC.trash(),hb.id)}</div>`).join('')}</div>`;
  if(habView==='grid')h+=`<div style="display:flex;flex-direction:column;gap:12px">${habits.map(hb=>{const tot=Array.from({length:dim_},(_,i)=>ckd(hb.id,i+1)).filter(Boolean).length;return`<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><span style="font-size:14px;font-weight:500;color:#18150f">${hb.name}</span><span style="font-size:12px;color:${hb.color};font-weight:600">${tot}/${dim_} días</span></div><div style="display:flex;flex-wrap:wrap;gap:3px">${Array.from({length:dim_},(_,i)=>i+1).map(day=>`<button class="dcell" data-action="toggle-habit" data-hid="${hb.id}" data-day="${day}" style="background:${ckd(hb.id,day)?hb.color:'#eeebe4'};color:${ckd(hb.id,day)?'#fff':'#a09890'}">${day}</button>`).join('')}</div></div>`;}).join('')}</div>`;
  h+=`<div style="margin-top:12px" id="hab-wrap"><button class="btn btn-p" style="width:100%;justify-content:center" data-action="show-hab-form">${IC.plus()} Nuevo hábito</button></div>`;
  G('page-habits').innerHTML=h;
}
function toggleHabit(hid,day){const{y,m}=NOW();const ch=ld(gk('checks',y,m),{});const k=`${hid}_${day}`;ch[k]=!ch[k];sv(gk('checks',y,m),ch);renderHabits();}
function showHabitForm(){
  const w=G('hab-wrap');if(!w)return;
  w.innerHTML=`<div class="card"><div style="display:flex;gap:8px"><input class="inp" id="hname" placeholder="Nombre del hábito" style="flex:1"/><button class="btn btn-p" data-action="add-hab">${IC.save()}</button><button class="btn btn-g" data-action="cancel-hab">✕</button></div></div>`;
  setTimeout(()=>{const i=G('hname');if(i){i.focus();i.addEventListener('keydown',e=>{if(e.key==='Enter')addHabit();});}},100);
}
function addHabit(){const name=(G('hname')||{}).value?.trim();if(!name)return;const habits=ld(gk('habits'),[]);habits.push({id:uid(),name,color:HCOLORS[habits.length%HCOLORS.length]});sv(gk('habits'),habits);renderHabits();}
function delHabit(id){if(!confirm('¿Eliminar?'))return;sv(gk('habits'),ld(gk('habits'),[]).filter(h=>h.id!==id));renderHabits();}

// ── NUTRITION ───────────────────────────────────────────────────────────────
let mealTypeSelected='Desayuno';
function renderNutrition(){
  if(!nutSel)nutSel=NOW();
  const{y,m,d}=nutSel;const meals=ld(gk('meals',y,m,d),[]);
  const bt=MEAL_TYPES.reduce((a,t)=>({...a,[t]:meals.filter(x=>x.type===t)}),{});
  let h=`${navRow('nut-prev','nut-next',FD(y,m,d))}${MEAL_TYPES.map(type=>`<div style="margin-bottom:16px"><div style="display:flex;align-items:center;gap:8px;margin-bottom:6px"><div style="width:8px;height:8px;border-radius:50%;background:${MCOLOR[type]}"></div><span style="font-size:13px;font-weight:600;color:#18150f">${type}</span></div>${bt[type].length===0?`<div style="font-size:13px;color:#a09890;padding-left:16px">—</div>`:bt[type].map(item=>`<div style="display:flex;justify-content:space-between;align-items:center;padding-left:16px;padding-bottom:6px"><span style="font-size:13px;color:#18150f">${item.desc}</span>${iBtn('del-meal',IC.trash(),item.id)}</div>`).join('')}</div>`).join('')}<div id="meal-wrap"><button class="btn btn-p" style="width:100%;justify-content:center;margin-top:8px" data-action="show-meal-form">${IC.plus()} Registrar comida</button></div>`;
  G('page-nutrition').innerHTML=h;
}
function nutShift(n){const dt=new Date(nutSel.y,nutSel.m,nutSel.d+n);nutSel={y:dt.getFullYear(),m:dt.getMonth(),d:dt.getDate()};renderNutrition();}
function showMealForm(){
  const w=G('meal-wrap');if(!w)return;
  mealTypeSelected='Desayuno';
  w.innerHTML=`<div class="card" style="margin-top:10px"><div class="tabs-row">${MEAL_TYPES.map((t,i)=>`<button class="pill${i===0?' active':''}" data-action="meal-type" data-type="${t}">${t}</button>`).join('')}</div><input class="inp" id="mdesc" placeholder="¿Qué comiste?" style="margin-bottom:10px"/><div style="display:flex;gap:8px"><button class="btn btn-p" data-action="add-meal">${IC.save()} Guardar</button><button class="btn btn-g" data-action="cancel-meal">Cancelar</button></div></div>`;
  setTimeout(()=>{const i=G('mdesc');if(i){i.focus();i.addEventListener('keydown',e=>{if(e.key==='Enter')addMeal();});}},100);
}
function setMealType(type,btn){
  mealTypeSelected=type;
  document.querySelectorAll('[data-action="meal-type"]').forEach(b=>b.classList.toggle('active',b.dataset.type===type));
}
function addMeal(){const desc=(G('mdesc')||{}).value?.trim();if(!desc)return;const{y,m,d}=nutSel;const meals=ld(gk('meals',y,m,d),[]);meals.push({id:uid(),type:mealTypeSelected,desc});sv(gk('meals',y,m,d),meals);renderNutrition();}
function delMeal(id){const{y,m,d}=nutSel;sv(gk('meals',y,m,d),ld(gk('meals',y,m,d),[]).filter(x=>x.id!==id));renderNutrition();}

// ── JOURNAL ─────────────────────────────────────────────────────────────────
function renderJournal(){
  if(!jSel)jSel=NOW();
  const{y,m,d}=NOW();
  const entry=ld(gk('journal',jSel.y,jSel.m,jSel.d),{text:'',mood:null});
  const history=(()=>{const es=[];for(let i=0;i<120;i++){const dt=new Date(y,m,d-i);const sd={y:dt.getFullYear(),m:dt.getMonth(),d:dt.getDate()};const e=ld(gk('journal',sd.y,sd.m,sd.d),null);if(e&&e.text&&e.text.trim())es.push({...sd,...e,dateLabel:FD(sd.y,sd.m,sd.d)});}return es;})();
  const filtered=history.filter(e=>!jSearch.trim()||e.text.toLowerCase().includes(jSearch.toLowerCase())||e.dateLabel.toLowerCase().includes(jSearch.toLowerCase()));
  const wc=entry.text.trim()?entry.text.trim().split(/\s+/).length:0;
  const isToday=jSel.y===y&&jSel.m===m&&jSel.d===d;
  let h=`<div class="tabs-row"><button class="pill${jView==='write'?' active':''}" data-action="j-view" data-view="write">Escribir</button><button class="pill${jView==='history'?' active':''}" data-action="j-view" data-view="history">Historial${history.length?` (${history.length})`:''}</button></div>`;
  if(jView==='write'){
    h+=`${navRow('j-prev','j-next',FD(jSel.y,jSel.m,jSel.d)+(isToday?' <span style="font-size:11px;color:#1a3d16">Hoy</span>'':''))}
    <div class="card" style="margin-bottom:12px"><div class="lbl">¿Cómo fue tu día?</div><div style="display:flex;gap:4px;justify-content:space-around">${MOODS.map((mood,i)=>`<button class="mood-btn${entry.mood===i?' active':''}" data-action="j-mood" data-mood="${i}">${mood.e}</button>`).join('')}</div>${entry.mood!==null?`<div style="font-size:12px;color:#1a3d16;text-align:center;margin-top:8px;font-weight:500">${MOODS[entry.mood].l}</div>`:''}</div>
    <div class="card" style="margin-bottom:12px"><div class="lbl">Tu entrada</div><textarea id="j-textarea" rows="10" placeholder="Escribe libremente...&#10;&#10;¿Qué lograste hoy? ¿Qué aprendiste? ¿Cómo te sentiste?" style="font-size:15px;line-height:1.75;color:#18150f;box-sizing:border-box">${entry.text}</textarea><div class="divider"></div><div style="display:flex;justify-content:space-between;align-items:center"><span id="j-wc" style="font-size:11px;color:#a09890">${wc} palabras</span><button class="btn btn-p" id="j-save-btn" data-action="j-save">${IC.save()} Guardar</button></div></div>
    <div class="card" style="background:#edf5eb;border-color:#1a3d1622"><div class="lbl">Prompts para reflexionar</div>${['¿Cuál fue el mejor momento del día?','¿Qué me costó trabajo? ¿Cómo lo manejé?','¿Qué haría diferente mañana?','¿Por qué estoy agradecido hoy?'].map((p,i,arr)=>`<button style="font-size:13px;color:#1a3d16;padding:6px 0;background:none;border:none;border-bottom:${i<arr.length-1?'1px dashed #e6e2da':'none'};width:100%;text-align:left;cursor:pointer;font-family:inherit" data-action="j-prompt" data-p="${p}">${p}</button>`).join('')}</div>`;
  }
  if(jView==='history'){
    h+=`<div style="position:relative;margin-bottom:14px"><span style="position:absolute;left:12px;top:50%;transform:translateY(-50%);color:#a09890;pointer-events:none;display:flex">${IC.search}</span><input class="inp" id="j-search" placeholder="Buscar en tu diario…" value="${jSearch}" style="padding-left:36px"/></div>
    ${filtered.length===0?`<div class="empty">${history.length===0?'Aún no tienes entradas.':'Sin resultados.'}</div>`:''}
    <div style="display:flex;flex-direction:column;gap:10px">${filtered.map(e=>`<button class="card" data-action="j-open" data-y="${e.y}" data-m="${e.m}" data-d="${e.d}" style="width:100%;text-align:left;cursor:pointer;background:#fff"><div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px"><div style="display:flex;align-items:center;gap:8px"><span class="serif" style="font-size:14px;font-weight:600;color:#18150f">${e.dateLabel}</span>${e.mood!==null?`<span style="font-size:16px">${MOODS[e.mood].e}</span>`:''}</div><span style="font-size:11px;color:#a09890">${e.text.trim().split(/\s+/).length} palabras</span></div><p style="font-size:13px;color:#6a6057;margin:0;line-height:1.6;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden">${e.text}</p></button>`).join('')}</div>`;
  }
  G('page-journal').innerHTML=h;
}
function jShift(n){const dt=new Date(jSel.y,jSel.m,jSel.d+n);jSel={y:dt.getFullYear(),m:dt.getMonth(),d:dt.getDate()};renderJournal();}
function setMood(i){const entry=ld(gk('journal',jSel.y,jSel.m,jSel.d),{text:'',mood:null});entry.mood=entry.mood===i?null:i;sv(gk('journal',jSel.y,jSel.m,jSel.d),entry);renderJournal();}
function autoSaveJ(ta){const wc=ta.value.trim()?ta.value.trim().split(/\s+/).length:0;const w=G('j-wc');if(w)w.textContent=`${wc} palabras`;const entry=ld(gk('journal',jSel.y,jSel.m,jSel.d),{text:'',mood:null});entry.text=ta.value;sv(gk('journal',jSel.y,jSel.m,jSel.d),entry);}
function saveJournal(){const ta=G('j-textarea');if(!ta)return;autoSaveJ(ta);const btn=G('j-save-btn');if(btn){btn.innerHTML='¡Guardado ✓';setTimeout(()=>{if(G('j-save-btn'))G('j-save-btn').innerHTML=IC.save()+' Guardar';},2000);}}
function insertPrompt(p){const ta=G('j-textarea');if(!ta)return;const sep=ta.value?'\n\n':'';ta.value+=sep+'• '+p+' ';ta.focus();autoSaveJ(ta);}

// ── Init ────────────────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded',function(){
  G('hdate').textContent=new Date().toLocaleDateString('es-MX',{weekday:'long',year:'numeric',month:'long',day:'numeric'});
  const{y,m}=NOW();finY=y;finM=m;
  renderHome();
});
</script>
